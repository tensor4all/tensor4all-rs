[package]
name = "tensor4all-treersi"
description = "Recursive Sketched Interpolation for Hadamard products on tree tensor networks"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[features]
# Opt-in context-free `hadamard_many` on the process-global route.
global-defaults = ["tensor4all-core/global-defaults"]
# CUDA execution of the sketch contractions. The lower-triangular solve of
# the rank decision runs on a run-owned CPU context; the input-core readback still enters the process-global
# CPU context, so this feature also requires the host default context.
tenferro-cuda = [
    "global-defaults",
    "tensor4all-core/tenferro-cuda",
    "tensor4all-treetn/tenferro-cuda",
    "tensor4all-tensorbackend/tenferro-cuda",
]

[dependencies]
anyhow.workspace = true
num-complex.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
thiserror.workspace = true
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false }

[dev-dependencies]
# `hadamard_many` and the context-free test helpers need the process-global
# route (tensor4all-rs#1403); `global-defaults` implies core's.
tensor4all-treersi = { path = ".", default-features = false, features = ["global-defaults"] }

[[test]]
name = "integration"
path = "tests/main.rs"
