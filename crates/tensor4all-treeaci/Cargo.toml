[package]
name = "tensor4all-treeaci"
description = "Alternating Cross Interpolation for tree tensor networks"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[features]
diagnostics = ["tensor4all-treetn/diagnostics"]

[dependencies]
anyhow.workspace = true
rand_chacha.workspace = true
num-complex.workspace = true
rand.workspace = true
rand_distr.workspace = true
thiserror.workspace = true
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false }

[dev-dependencies]
# Tests, doctests and benches still exercise the context-free API, which needs
# the process-global route (tensor4all-rs#1403); the library itself does not.
tensor4all-core = { path = "../tensor4all-core", default-features = false, features = ["global-defaults"] }
criterion.workspace = true
serde_json.workspace = true
tenferro-cpu.workspace = true

[[bench]]
name = "aci_scaling"
harness = false

[[bench]]
name = "f7_context_overhead"
harness = false

[[test]]
name = "integration"
path = "tests/main.rs"
