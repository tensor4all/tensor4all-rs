[package]
name = "tensor4all-treeaci"
description = "Alternating Cross Interpolation for tree tensor networks"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[features]
default = ["tenferro-cpu-faer"]
diagnostics = ["tensor4all-treetn/diagnostics"]
tenferro-cpu-faer = [
    "tensor4all-treetn/tenferro-cpu-faer",
    "tensor4all-tensorbackend/backend-tenferro",
    "tensor4all-tensorbackend/tenferro-cpu-faer",
]
tenferro-system-blas = [
    "tensor4all-treetn/tenferro-system-blas",
    "tensor4all-tensorbackend/backend-tenferro",
    "tensor4all-tensorbackend/tenferro-system-blas",
]
tenferro-provider-inject = [
    "tensor4all-treetn/tenferro-provider-inject",
    "tensor4all-tensorbackend/backend-tenferro",
    "tensor4all-tensorbackend/tenferro-provider-inject",
]

[dependencies]
rand_chacha.workspace = true
num-complex.workspace = true
rand.workspace = true
rand_distr.workspace = true
thiserror.workspace = true
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false }

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true
tenferro-cpu.workspace = true

[[bench]]
name = "aci_scaling"
harness = false

[[bench]]
name = "f7_context_overhead"
harness = false

[[test]]
name = "integration"
path = "tests/main.rs"
