[package]
name = "tensor4all-core"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core tensor types, indices, and operations (SVD, QR, contraction) for tensor4all"

[features]
default = ["backend-tenferro", "tenferro-cpu-faer"]
backend-tenferro = ["tensor4all-tensorbackend/backend-tenferro"]
tenferro-cuda = [
    "backend-tenferro",
    "tenferro-cpu-faer",
    "tensor4all-tensorbackend/tenferro-cuda",
    "tenferro-ad/cuda",
    "tenferro-einsum/cuda",
    "tenferro-linalg/cuda",
]
tenferro-cpu-faer = [
    "tensor4all-tensorbackend/tenferro-cpu-faer",
    "tenferro/native",
    "tenferro-ad/native",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/native",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/native",
]
tenferro-system-blas = [
    "tensor4all-tensorbackend/tenferro-system-blas",
    "tenferro/blas",
    "tenferro-ad/blas",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/blas",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/blas",
]
tenferro-provider-inject = [
    "tensor4all-tensorbackend/tenferro-provider-inject",
    "tenferro/blas",
    "tenferro-ad/blas",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/blas",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/provider-inject",
]

[dependencies]
# `global-defaults` is required in every configuration: this crate re-exports
# `TensorElement` and uses `Matrix`/`ExecutionContext`/`mat_mul` in un-gated code.
# It selects no provider, so the `tenferro-*` provider features stay independent.
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false, features = ["global-defaults"] }
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true
anyhow.workspace = true
bnum.workspace = true
paste.workspace = true
dyn-clone.workspace = true
rand.workspace = true
rand_distr.workspace = true
omeco.workspace = true
petgraph.workspace = true
smallvec.workspace = true
tenferro.workspace = true
tenferro-ad.workspace = true
tenferro-einsum.workspace = true
tenferro-linalg.workspace = true
tenferro-tensor.workspace = true

[dev-dependencies]
rand_chacha.workspace = true
tenferro-tensor.workspace = true
tenferro-cpu.workspace = true
approx.workspace = true
criterion.workspace = true

[[bench]]
name = "rrlu_bench"
harness = false

[[bench]]
name = "cached_function"
harness = false

[[bench]]
name = "dense_vs_tenferro"
harness = false

[[bench]]
name = "index_key"
harness = false

[[bench]]
name = "lazy_block_rook"
harness = false
