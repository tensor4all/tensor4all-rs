[package]
name = "tensor4all-core"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core tensor types, indices, and operations (SVD, QR, contraction) for tensor4all"
autotests = false

[features]
default = ["tenferro-cpu-platform"]
# Opt-in legacy route: context-free operations fall back to one process-global
# CPU context and eager runtime (see `src/implicit_route.rs`). Without it, a
# context-free operation that would need that fallback returns
# `ExecutionContextEntryError::NoContext` instead of choosing an engine.
global-defaults = ["tensor4all-tensorbackend/global-defaults"]
# Compatibility alias for `global-defaults`.
backend-tenferro = ["global-defaults"]
tenferro-cuda = [
    "tenferro-cpu-faer",
    "tensor4all-tensorbackend/tenferro-cuda",
    "tenferro-ad/cuda",
    "tenferro-einsum/cuda",
    "tenferro-linalg/cuda",
]
# The platform default: Apple Accelerate on macOS, faer elsewhere
# (see the `tensor4all-cpu-platform` crate).
tenferro-cpu-platform = [
    "tensor4all-tensorbackend/tenferro-cpu-platform",
    "tenferro-einsum/autodiff",
    "tenferro-linalg/autodiff",
]
tenferro-cpu-faer = [
    "tensor4all-tensorbackend/tenferro-cpu-faer",
    "tenferro/native",
    "tenferro-ad/native",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/native",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/native",
]
tenferro-system-blas = [
    "tensor4all-tensorbackend/tenferro-system-blas",
    "tenferro/blas",
    "tenferro-ad/blas",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/blas",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/blas",
]
tenferro-provider-inject = [
    "tensor4all-tensorbackend/tenferro-provider-inject",
    "tenferro/blas",
    "tenferro-ad/blas",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/blas",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/provider-inject",
]

[dependencies]
# The canonical explicit surface; the process-global route is this crate's opt-in
# `global-defaults` feature. It selects no provider, so the `tenferro-*` provider
# features stay independent.
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false, features = ["explicit-context"] }
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true
anyhow.workspace = true
bnum.workspace = true
paste.workspace = true
dyn-clone.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
rustc-hash.workspace = true
omeco.workspace = true
petgraph.workspace = true
tinyvec.workspace = true
tenferro.workspace = true
tenferro-ad.workspace = true
tenferro-einsum.workspace = true
tenferro-linalg.workspace = true
tenferro-tensor.workspace = true

[dev-dependencies]
# Tests, doctests and benches still exercise the context-free API, which needs
# the process-global route (tensor4all-rs#1403); the library itself does not.
tensor4all-core = { path = ".", default-features = false, features = ["global-defaults"] }
tenferro-tensor.workspace = true
tenferro-cpu.workspace = true
approx.workspace = true
criterion.workspace = true

[[bench]]
name = "rrlu_bench"
harness = false

[[bench]]
name = "cached_function"
harness = false

[[bench]]
name = "dense_vs_tenferro"
harness = false

[[bench]]
name = "index_key"
