[[test]]
name = "idx_tensor_content_digest"
path = "tests/idx_tensor_content_digest.rs"

[[test]]
name = "plain_tensor_retention"
path = "tests/plain_tensor_retention.rs"

[[test]]
name = "linalg_svd"
path = "tests/linalg_svd.rs"

[[test]]
name = "default_engine_reentry"
path = "tests/default_engine_reentry.rs"
