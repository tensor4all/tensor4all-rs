[package]
name = "tensor4all-hdf5"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
description = "HDF5 serialization for tensor4all-rs (ITensors.jl compatible format)"

[features]
default = ["link", "tenferro-cpu-platform"]
link = ["dep:hdf5-metno", "dep:hdf5-metno-sys"]
runtime-loading = ["dep:hdf5-rt"]
# The platform default: Apple Accelerate on macOS, faer elsewhere
# (see the `tensor4all-cpu-platform` crate).
tenferro-cpu-platform = [
    "tensor4all-core/backend-tenferro",
    "tensor4all-core/tenferro-cpu-platform",
    "tensor4all-itensorlike/tenferro-cpu-platform",
    "tensor4all-treetn/tenferro-cpu-platform",
]
tenferro-cpu-faer = [
    "tensor4all-core/backend-tenferro",
    "tensor4all-core/tenferro-cpu-faer",
    "tensor4all-itensorlike/tenferro-cpu-faer",
    "tensor4all-treetn/tenferro-cpu-faer",
]
tenferro-system-blas = [
    "tensor4all-core/backend-tenferro",
    "tensor4all-core/tenferro-system-blas",
    "tensor4all-itensorlike/tenferro-system-blas",
    "tensor4all-treetn/tenferro-system-blas",
]
tenferro-provider-inject = [
    "tensor4all-core/backend-tenferro",
    "tensor4all-core/tenferro-provider-inject",
    "tensor4all-itensorlike/tenferro-provider-inject",
    "tensor4all-treetn/tenferro-provider-inject",
]

[dependencies]
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-itensorlike = { path = "../tensor4all-itensorlike", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false }
hdf5-metno = { workspace = true, default-features = false, features = ["complex"], optional = true }
hdf5-metno-sys = { version = "0.12", default-features = false, optional = true }
hdf5-rt = { workspace = true, default-features = false, features = ["complex"], optional = true }
num-complex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
ndarray = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
tempfile = "3"

[[test]]
# The integration test drives the link-time `hdf5-metno` API directly, so it
# cannot compile when only the `runtime-loading` backend is selected. PR CI and
# the default nightly rows enable `link` and still run it.
name = "test_hdf5"
path = "tests/test_hdf5.rs"
required-features = ["link"]
