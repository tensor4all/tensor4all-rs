[package]
name = "tensor4all-tensorbackend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tensor storage and linear algebra backend for tensor4all"
keywords = ["tensor", "storage", "backend", "linear-algebra"]
categories = ["science", "mathematics"]

[features]
default = ["backend-tenferro", "tenferro-cpu-faer"]
# Compatibility alias for the legacy process-global operation surface.
backend-tenferro = ["global-defaults"]
# Canonical caller-supplied CPU context without process-global fallbacks.
explicit-context = []
# Opt-in legacy operations backed by one process-global context.
global-defaults = ["explicit-context"]
tenferro-cuda = [
    "explicit-context",
    "tenferro-cpu-faer",
    "dep:tenferro-gpu",
    "tenferro-gpu/cuda",
    "tenferro-ad/cuda",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/cuda",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/cuda",
]
tenferro-cpu-faer = [
    "tenferro/native",
    "tenferro-ad/native",
    "tenferro-cpu/native",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/native",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/native",
]
tenferro-system-blas = [
    "tenferro/blas",
    "tenferro-ad/blas",
    "tenferro-cpu/blas",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/blas",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/blas",
]
tenferro-provider-inject = [
    "tenferro/blas",
    "tenferro-ad/blas",
    "tenferro-cpu/provider-inject",
    "tenferro-einsum/autodiff",
    "tenferro-einsum/blas",
    "tenferro-linalg/autodiff",
    "tenferro-linalg/provider-inject",
]
einsum-dispatch-profile = []

[dependencies]
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rand.workspace = true
rand_distr.workspace = true
omeco.workspace = true
rayon.workspace = true
tenferro.workspace = true
tenferro-ad.workspace = true
tenferro-cpu.workspace = true
tenferro-einsum.workspace = true
tenferro-linalg.workspace = true
tenferro-tensor.workspace = true
tenferro-gpu = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
criterion.workspace = true

[[bench]]
name = "grouped_gemm"
harness = false
required-features = ["global-defaults"]

[[test]]
name = "bench_einsum_native"
required-features = ["global-defaults"]
