[package]
name = "tensor4all-tensorci"
description = "Tensor Cross Interpolation algorithms for tensor4all"
version.workspace = true
edition.workspace = true
authors = ["Marc Ritter <Ritter.Marc@physik.uni-muenchen.de>", "Hiroshi Shinaoka <h.shinaoka@gmail.com>", "tensor4all contributors"]
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]
rand_chacha.workspace = true
num-complex.workspace = true
num-traits.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rand.workspace = true
rustc-hash.workspace = true
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-simplett = { path = "../tensor4all-simplett", default-features = false }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }

[dev-dependencies]
# Tests, doctests and benches still exercise the context-free API, which needs
# the process-global route (tensor4all-rs#1403); the library itself does not.
tensor4all-core = { path = "../tensor4all-core", default-features = false, features = ["global-defaults"] }
approx.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tenferro-cpu.workspace = true
criterion.workspace = true
uint.workspace = true

[[bench]]
name = "end_to_end_chain_tci"
harness = false

[[test]]
name = "integration"
path = "tests/main.rs"
