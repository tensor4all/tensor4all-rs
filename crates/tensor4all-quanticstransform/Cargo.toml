[package]
name = "tensor4all-quanticstransform"
version.workspace = true
edition.workspace = true
authors = [
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "Markus Wallerberger <markus.wallerberger@tuwien.ac.at>",
    "Satoshi Terasaki <terasakisatoshi.math@gmail.com>",
    "Samuel Badr <samuel.badr@gmail.com>",
    "Gianluca Grosso <gianluca.grosso@campus.lmu.de>",
    "Hirone Ishida <sakai.39186@gmail.com>",
]
license.workspace = true
repository.workspace = true
description = "Quantics transformation operators for tensor train methods"
# Integration tests are listed explicitly so that heavy tests can be modules
# of `tests/main.rs` (see scripts/check-test-targets.py).
autotests = false

[package.metadata.docs.rs]
features = ["partitioned"]

[features]
partitioned = ["dep:tensor4all-partitionedtreetn"]
default = ["tenferro-cpu-platform"]
# The platform default: Apple Accelerate on macOS, faer elsewhere
# (see the `tensor4all-cpu-platform` crate).
tenferro-cpu-platform = [
    "tensor4all-core/tenferro-cpu-platform",
    "tensor4all-simplett/tenferro-cpu-platform",
    "tensor4all-treetn/tenferro-cpu-platform",
    "tensor4all-partitionedtreetn?/tenferro-cpu-platform",
]
tenferro-cpu-faer = [
    "tensor4all-core/tenferro-cpu-faer",
    "tensor4all-simplett/tenferro-cpu-faer",
    "tensor4all-treetn/tenferro-cpu-faer",
    "tensor4all-partitionedtreetn?/tenferro-cpu-faer",
]
tenferro-system-blas = [
    "tensor4all-core/tenferro-system-blas",
    "tensor4all-simplett/tenferro-system-blas",
    "tensor4all-treetn/tenferro-system-blas",
    "tensor4all-partitionedtreetn?/tenferro-system-blas",
]
tenferro-provider-inject = [
    "tensor4all-core/tenferro-provider-inject",
    "tensor4all-simplett/tenferro-provider-inject",
    "tensor4all-treetn/tenferro-provider-inject",
    "tensor4all-partitionedtreetn?/tenferro-provider-inject",
]

[dependencies]
tensor4all-partitionedtreetn = { path = "../tensor4all-partitionedtreetn", optional = true, default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false, features = ["simplett-bridge"] }
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-simplett = { path = "../tensor4all-simplett", default-features = false }
quanticsgrids.workspace = true
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
anyhow.workspace = true
sprs = "0.11"

[dev-dependencies]
tensor4all-interpolativeqtt = { path = "../tensor4all-interpolativeqtt", default-features = false }
rand.workspace = true
rand_chacha.workspace = true
approx.workspace = true

[[example]]
name = "patched_fourier"
required-features = ["partitioned"]

[[example]]
name = "patched_fourier_large"
required-features = ["partitioned"]

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[[test]]
name = "large_fourier_smoke"
path = "tests/large_fourier_smoke.rs"

[[test]]
name = "multiaxis_fourier"
path = "tests/multiaxis_fourier.rs"

[[test]]
name = "patched_fourier"
path = "tests/patched_fourier.rs"

[[test]]
name = "phase_rotation_precision"
path = "tests/phase_rotation_precision.rs"

[[test]]
name = "qft_reconstruction"
path = "tests/qft_reconstruction.rs"

# Heavy tests (`#[ignore]`, selected by `test(/^heavy_/)` in heavy-tests.yml).
[[test]]
name = "heavy"
path = "tests/main.rs"
