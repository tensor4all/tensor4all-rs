[package]
name = "tensor4all-itensorlike"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ITensors.jl-like API for tensor operations"
readme = "README.md"
keywords = ["tensor", "itensor", "tensor-network"]
categories = ["science", "mathematics"]
autotests = false

[features]
# Compatibility alias: opt into the process-global route.
backend-tenferro = ["tensor4all-core/global-defaults"]

[dependencies]
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
num-complex.workspace = true
thiserror.workspace = true
petgraph.workspace = true
rand.workspace = true
anyhow.workspace = true
rand_chacha.workspace = true

[dev-dependencies]
# Tests, doctests and benches still exercise the context-free API, which needs
# the process-global route (tensor4all-rs#1403); the library itself does not.
tensor4all-core = { path = "../tensor4all-core", default-features = false, features = ["global-defaults"] }
criterion.workspace = true
rand_chacha.workspace = true
approx.workspace = true
tenferro-cpu.workspace = true

[[bench]]
name = "f7_contract_src_overhead"
harness = false

[[test]]
name = "integration"
path = "tests/main.rs"
