[package]
name = "tensor4all-simplett"
description = "Simple Tensor Train (MPS) algorithms for tensor4all"
version.workspace = true
edition.workspace = true
authors = [
    "Simone Foderà <simone.fodera@lmu.de>",
    "Marc Ritter <Ritter.Marc@physik.uni-muenchen.de>",
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
]
license.workspace = true
repository.workspace = true

[features]
default = ["tenferro-cpu-platform"]
# Compatibility alias: opt into the process-global route.
backend-tenferro = ["tensor4all-core/global-defaults"]
# The platform default: Apple Accelerate on macOS, faer elsewhere
# (see the `tensor4all-cpu-platform` crate).
tenferro-cpu-platform = [
    "tensor4all-core/tenferro-cpu-platform",
    "tensor4all-tensorbackend/tenferro-cpu-platform",
]
tenferro-cpu-faer = [
    "tensor4all-core/tenferro-cpu-faer",
    "tensor4all-tensorbackend/tenferro-cpu-faer",
]
tenferro-system-blas = [
    "tensor4all-core/tenferro-system-blas",
    "tensor4all-tensorbackend/tenferro-system-blas",
]
tenferro-provider-inject = [
    "tensor4all-core/tenferro-provider-inject",
    "tensor4all-tensorbackend/tenferro-provider-inject",
]

[dependencies]
num-complex.workspace = true
num-traits.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rand.workspace = true
rustc-hash.workspace = true
tensor4all-core = { path = "../tensor4all-core", default-features = false }
# `compress_svd_with_session` takes a caller-owned explicit `Session`.
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false, features = ["explicit-context"] }
tenferro-tensor.workspace = true

[dev-dependencies]
# Tests, doctests and benches still exercise the context-free API, which needs
# the process-global route (tensor4all-rs#1403); the library itself does not.
tensor4all-core = { path = "../tensor4all-core", default-features = false, features = ["global-defaults"] }
approx.workspace = true
rand_chacha.workspace = true
criterion.workspace = true
# The session tests and the held-session benchmark open an explicit one-worker context, which needs the
# concrete CPU backend type.
tenferro-cpu.workspace = true

[[bench]]
name = "full_tensor"
harness = false

[[bench]]
name = "cache_overhead"
harness = false

[[bench]]
name = "inner_product_session"
harness = false
