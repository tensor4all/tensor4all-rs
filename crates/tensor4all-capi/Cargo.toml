[package]
name = "tensor4all-capi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "C API for tensor4all (Rust) core types"

[lib]
name = "tensor4all_capi"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The C API has no engine handle yet (tensor4all-rs#1376 phase E1), so every
# entry point still runs on the process-global route.
tensor4all-core = { path = "../tensor4all-core", default-features = false, features = ["global-defaults"] }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false }
tensor4all-quanticstransform = { path = "../tensor4all-quanticstransform", default-features = false, features = ["simplett-transforms"] }
libc.workspace = true
paste.workspace = true
num-complex.workspace = true
num-rational = "0.4"
