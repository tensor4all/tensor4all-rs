[package]
name = "tensor4all-treetci"
version.workspace = true
edition.workspace = true
authors = [
    "tensor4all collaboration",
    "Ryo Watanabe <https://github.com/Ryo-wtnb11>",
]
license.workspace = true
repository.workspace = true
description = "Tree Tensor Cross Interpolation on tree graphs"
autotests = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
petgraph.workspace = true
num-complex.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tenferro-linalg.workspace = true
tenferro-tensor.workspace = true
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false }

[[bench]]
name = "g0_stage_budget"
harness = false

[[bench]]
name = "stage_components"
harness = false

[dev-dependencies]
# Tests, doctests and benches still exercise the context-free API, which needs
# the process-global route (tensor4all-rs#1403); the library itself does not.
tensor4all-core = { path = "../tensor4all-core", default-features = false, features = ["global-defaults"] }
tenferro-cpu.workspace = true
rayon.workspace = true
approx.workspace = true
quanticsgrids.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
