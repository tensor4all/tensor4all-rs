[package]
name = "tensor4all-quanticstci"
version.workspace = true
edition.workspace = true
authors = [
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "Markus Wallerberger <markus.wallerberger@tuwien.ac.at>",
    "Satoshi Terasaki <terasakisatoshi.math@gmail.com>",
]
license.workspace = true
repository.workspace = true
description = "High-level Quantics TCI interface for function interpolation"
autotests = false

[dependencies]
rand_chacha.workspace = true
tensor4all-treetci = { path = "../tensor4all-treetci", default-features = false }
tensor4all-simplett = { path = "../tensor4all-simplett", default-features = false }
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false, features = ["simplett-bridge"] }
quanticsgrids.workspace = true
num-complex.workspace = true
thiserror.workspace = true
num-traits.workspace = true
anyhow.workspace = true
rand.workspace = true

[dev-dependencies]
# Tests, doctests and benches still exercise the context-free API, which needs
# the process-global route (tensor4all-rs#1403); the library itself does not.
tensor4all-core = { path = "../tensor4all-core", default-features = false, features = ["global-defaults"] }
approx.workspace = true
tenferro-cpu.workspace = true
# Path-only dev-dependency so the QFT test can apply a real operator.
tensor4all-quanticstransform = { path = "../tensor4all-quanticstransform", default-features = false }

[[test]]
name = "integration"
path = "tests/main.rs"
