[package]
name = "tensor4all-partitionedtreetn"
description = "Partitioned Tree Tensor Networks with adaptive patching for tensor4all"
readme = "README.md"
keywords = ["tensor-network", "tensor-train", "tree-tensor-network"]
categories = ["science", "mathematics", "algorithms"]
rust-version = "1.85"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[features]
default = ["tenferro-cpu-faer"]
tenferro-cpu-faer = [
    "tensor4all-core/tenferro-cpu-faer",
    "tensor4all-treetn/tenferro-cpu-faer",
]
tenferro-system-blas = [
    "tensor4all-core/tenferro-system-blas",
    "tensor4all-treetn/tenferro-system-blas",
]
tenferro-provider-inject = [
    "tensor4all-core/tenferro-provider-inject",
    "tensor4all-treetn/tenferro-provider-inject",
]

[package.metadata.docs.rs]
features = ["tenferro-cpu-faer"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false }

[dev-dependencies]
criterion.workspace = true
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
tenferro-cpu.workspace = true
num-complex.workspace = true
serde_json.workspace = true
# Path-only cross-layer dev-dependency (stripped from published manifests) so
# the QFT integration tests can exercise a real Fourier operator. Its backend
# provider is inherited from this crate's selected provider feature.
tensor4all-quanticstransform = { path = "../tensor4all-quanticstransform", default-features = false }
# Path-only cross-layer dev-dependency (stripped from published manifests) so
# the adaptive interpolation tests and examples can run a real engine; the
# library itself depends only on the engine trait in tensor4all-treetn. Its
# backend provider is inherited from this crate's selected provider feature.
tensor4all-treetci = { path = "../tensor4all-treetci", default-features = false }
rand.workspace = true
rand_chacha.workspace = true

[[bench]]
name = "f7_engine_context_overhead"
harness = false

[[test]]
name = "integration"
path = "tests/main.rs"
