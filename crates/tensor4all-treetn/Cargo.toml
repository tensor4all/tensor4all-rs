[package]
name = "tensor4all-treetn"
version.workspace = true
edition = "2021"
authors.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
description = "Tree tensor networks with arbitrary graph topology for tensor4all"
autotests = false

[features]
default = ["tenferro-cpu-platform", "simplett-bridge"]
simplett-bridge = ["dep:tensor4all-simplett"]
tenferro-cuda = [
    "tensor4all-core/tenferro-cuda",
    "tensor4all-tensorbackend/tenferro-cuda",
]
# The platform default: Apple Accelerate on macOS, faer elsewhere
# (see the `tensor4all-cpu-platform` crate).
tenferro-cpu-platform = [
    "tensor4all-core/backend-tenferro",
    "tensor4all-core/tenferro-cpu-platform",
    "tensor4all-simplett?/tenferro-cpu-platform",
    "tensor4all-tensorbackend/backend-tenferro",
    "tensor4all-tensorbackend/tenferro-cpu-platform",
]
tenferro-cpu-faer = [
    "tensor4all-core/backend-tenferro",
    "tensor4all-core/tenferro-cpu-faer",
    "tensor4all-simplett?/tenferro-cpu-faer",
    "tensor4all-tensorbackend/backend-tenferro",
    "tensor4all-tensorbackend/tenferro-cpu-faer",
]
tenferro-system-blas = [
    "tensor4all-core/backend-tenferro",
    "tensor4all-core/tenferro-system-blas",
    "tensor4all-simplett?/tenferro-system-blas",
    "tensor4all-tensorbackend/backend-tenferro",
    "tensor4all-tensorbackend/tenferro-system-blas",
]
tenferro-provider-inject = [
    "tensor4all-core/backend-tenferro",
    "tensor4all-core/tenferro-provider-inject",
    "tensor4all-simplett?/tenferro-provider-inject",
    "tensor4all-tensorbackend/backend-tenferro",
    "tensor4all-tensorbackend/tenferro-provider-inject",
]
diagnostics = []

[dependencies]
rustc-hash.workspace = true
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-simplett = { path = "../tensor4all-simplett", default-features = false, optional = true }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
petgraph.workspace = true
anyhow.workspace = true
num-complex.workspace = true
dyn-clone.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
tenferro.workspace = true
tenferro-cpu.workspace = true
criterion.workspace = true

[[bench]]
name = "cached_evaluator"
harness = false

[[bench]]
name = "fit_environment"
harness = false

[[example]]
name = "cuda_quickstart"
required-features = ["tenferro-cuda", "tenferro-cpu-faer"]

[[example]]
name = "cuda_component_upload"
required-features = ["tenferro-cuda", "tenferro-cpu-faer"]

[[example]]
name = "cuda_tree_contraction"
required-features = ["tenferro-cuda", "tenferro-cpu-faer"]

[[test]]
name = "integration"
path = "tests/main.rs"

# Installs a process-global counting allocator: must not share a test binary
# with tests that measure anything else.
[[test]]
name = "allocation"
path = "tests/allocation.rs"

[[test]]
name = "tdvp_profile"
path = "tests/tdvp_profile.rs"
