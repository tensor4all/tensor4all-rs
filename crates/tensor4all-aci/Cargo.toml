[package]
name = "tensor4all-aci"
description = "Alternating Cross Interpolation elementwise operations for tensor4all tensor trains"
version.workspace = true
edition.workspace = true
authors = [
    "Marc Ritter <mritter@flatironinstitute.org>",
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "tensor4all contributors",
]
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]
num-complex.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
thiserror.workspace = true
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-simplett = { path = "../tensor4all-simplett", default-features = false }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }

[dev-dependencies]
# Tests, doctests and benches still exercise the context-free API, which needs
# the process-global route (tensor4all-rs#1403); the library itself does not.
tensor4all-core = { path = "../tensor4all-core", default-features = false, features = ["global-defaults"] }
rand_chacha.workspace = true
tenferro-cpu.workspace = true
tensor4all-treeaci = { path = "../tensor4all-treeaci", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false, features = ["simplett-bridge"] }
approx.workspace = true
criterion.workspace = true

[[bench]]
name = "elementwise_scaling"
harness = false

[[bench]]
name = "treeaci_parity"
harness = false

[[test]]
name = "integration"
path = "tests/main.rs"
