[package]
name = "tensor4all-interpolativeqtt"
version.workspace = true
edition.workspace = true
authors = [
    "Marc Ritter <Ritter.Marc@physik.uni-muenchen.de>",
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "Martin Mikkelsen <https://github.com/MartinMikkelsen>",
]
license.workspace = true
repository.workspace = true
description = "Interpolative Quantics Tensor Train construction"

[features]
# Lane fan-out over caller-owned engines.
parallel = ["dep:hataori", "dep:hataori-tenferro"]

[dependencies]
hataori = { workspace = true, optional = true }
hataori-tenferro = { workspace = true, optional = true }
thiserror.workspace = true
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false }
# The public API takes caller-owned `CpuEngine`s (`explicit-context`).
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false, features = ["explicit-context"] }

[[bench]]
name = "chebyshev_patches"
harness = false
path = "benches/chebyshev_patches.rs"

[dev-dependencies]
# Tests, doctests and benches still exercise the context-free API, which needs
# the process-global route (tensor4all-rs#1403); the library itself does not.
tensor4all-core = { path = "../tensor4all-core", default-features = false, features = ["global-defaults"] }
rayon.workspace = true
approx.workspace = true
num-complex.workspace = true
quanticsgrids.workspace = true
rand.workspace = true
