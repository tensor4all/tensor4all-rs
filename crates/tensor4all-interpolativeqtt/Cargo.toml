[package]
name = "tensor4all-interpolativeqtt"
version.workspace = true
edition.workspace = true
authors = [
    "Marc Ritter <Ritter.Marc@physik.uni-muenchen.de>",
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "Martin Mikkelsen <https://github.com/MartinMikkelsen>",
]
license.workspace = true
repository.workspace = true
description = "Interpolative Quantics Tensor Train construction"

[features]
default = ["tenferro-cpu-platform"]
# The platform default: Apple Accelerate on macOS, faer elsewhere
# (see the `tensor4all-cpu-platform` crate).
tenferro-cpu-platform = [
    "tensor4all-core/tenferro-cpu-platform",
    "tensor4all-simplett/tenferro-cpu-platform",
    "tensor4all-tensorbackend/tenferro-cpu-platform",
]
tenferro-cpu-faer = [
    "tensor4all-core/tenferro-cpu-faer",
    "tensor4all-simplett/tenferro-cpu-faer",
    "tensor4all-tensorbackend/tenferro-cpu-faer",
]
tenferro-system-blas = [
    "tensor4all-core/tenferro-system-blas",
    "tensor4all-simplett/tenferro-system-blas",
    "tensor4all-tensorbackend/tenferro-system-blas",
]
tenferro-provider-inject = [
    "tensor4all-core/tenferro-provider-inject",
    "tensor4all-simplett/tenferro-provider-inject",
    "tensor4all-tensorbackend/tenferro-provider-inject",
]

# Lane fan-out over caller-owned engines. Provider-neutral: the CPU provider
# stays whatever the default or an explicit `tenferro-*` feature selects.
parallel = ["dep:hataori", "dep:hataori-tenferro"]

[dependencies]
hataori = { workspace = true, optional = true }
hataori-tenferro = { workspace = true, optional = true }
thiserror.workspace = true
# Scalar traits only (`MatrixLuciScalar`, `CommonScalar`); already a
# dependency of tensor4all-simplett.
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-simplett = { path = "../tensor4all-simplett", default-features = false }
# The public API takes caller-owned `CpuEngine`s (`explicit-context`).
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false, features = ["explicit-context"] }

[dev-dependencies]
rayon.workspace = true
approx.workspace = true
num-complex.workspace = true
quanticsgrids.workspace = true
rand.workspace = true
