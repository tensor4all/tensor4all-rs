[package]
name = "tensor4all-partitionedtt"
description = "Partitioned Tensor Train for tensor4all"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `adaptive-hataori-rayon` is deliberately not a default feature. Its worker callbacks reach the tenferro
# CPU session from Rayon workers through the compatibility route, which tenferro-rs #2004 rejects as
# `SessionEntryError::Contended`; on a worker the compatibility frontend falls back to an unrelated one-thread
# backend, so the work runs, but not in the issuing execution (measured: the split-forcing fixture completes
# while the process-global backend is held). The feature still compiles and its tests remain under
# `#[cfg(feature = ...)]` as the legacy path.
#
# The supported worker path is `adaptiveinterpolate_on_phase`, which is not behind a feature: it runs each
# wave's patches on the lanes of a session the caller holds, so the work runs in the issuing execution. See
# docs/design/859-f4-interpolation-child-executions.md.
default = ["tenferro-cpu-faer"]
adaptive-hataori-rayon = ["dep:hataori", "hataori/rayon"]
adaptive-hataori-mpi = [
    "adaptive-hataori-rayon",
    "hataori/mpi",
    "dep:mpi",
    "dep:serde",
    "num-complex/serde",
]
tenferro-cpu-faer = [
    "tensor4all-core/tenferro-cpu-faer",
    "tensor4all-itensorlike/tenferro-cpu-faer",
    "tensor4all-simplett/tenferro-cpu-faer",
    "tensor4all-tensorbackend/tenferro-cpu-faer",
    "tensor4all-tensorci/tenferro-cpu-faer",
    "tensor4all-treetn/tenferro-cpu-faer",
]
tenferro-system-blas = [
    "tensor4all-core/tenferro-system-blas",
    "tensor4all-itensorlike/tenferro-system-blas",
    "tensor4all-simplett/tenferro-system-blas",
    "tensor4all-tensorbackend/tenferro-system-blas",
    "tensor4all-tensorci/tenferro-system-blas",
    "tensor4all-treetn/tenferro-system-blas",
]
tenferro-provider-inject = [
    "tensor4all-core/tenferro-provider-inject",
    "tensor4all-itensorlike/tenferro-provider-inject",
    "tensor4all-simplett/tenferro-provider-inject",
    "tensor4all-tensorbackend/tenferro-provider-inject",
    "tensor4all-tensorci/tenferro-provider-inject",
    "tensor4all-treetn/tenferro-provider-inject",
]

[dependencies]
rand_chacha.workspace = true
num-complex.workspace = true
num-traits.workspace = true
rand.workspace = true
thiserror.workspace = true
anyhow.workspace = true
hataori = { workspace = true, optional = true }
mpi = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tensor4all-core = { path = "../tensor4all-core", default-features = false }
tensor4all-itensorlike = { path = "../tensor4all-itensorlike", default-features = false }
tensor4all-simplett = { path = "../tensor4all-simplett", default-features = false }
tensor4all-tensorbackend = { path = "../tensor4all-tensorbackend", default-features = false }
tensor4all-tensorci = { path = "../tensor4all-tensorci", default-features = false }
tensor4all-treetn = { path = "../tensor4all-treetn", default-features = false, features = ["simplett-bridge"] }

[dev-dependencies]
tenferro-cpu.workspace = true
approx.workspace = true
rayon.workspace = true

[[example]]
name = "adaptive_mpi_smoke"
required-features = ["adaptive-hataori-mpi"]
