name: Deploy Documentation

on:
  push:
    branches: [main]
    # Only what the published site is built from. A commit that touches none of
    # these (tests, scripts, benchmarks, other workflows) cannot change the site.
    # Run the workflow manually (workflow_dispatch) to redeploy regardless.
    paths:
      - "docs/**"
      - "crates/*/src/**"
      - "crates/*/Cargo.toml"
      - "crates/*/README.md"
      - "tools/*/src/**"
      - "tools/*/Cargo.toml"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run on the main repository, not on forks
    if: github.repository == 'tensor4all/tensor4all-rs'
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2
          fallback: none

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true

      # The rustdoc and mdBook examples are not re-run here: `CI_rs` Doctests ran
      # them on the pull request head before it merged, and a docs deploy that
      # re-ran them bought nothing but ~5 min per deploy.

      - name: Build mdBook
        run: mdbook build docs/book

      - name: Build rustdoc
        run: cargo xtask doc

      - name: Combine documentation
        run: |
          mkdir -p _site
          cp -r docs/book/book/* _site/
          mkdir -p _site/rustdoc
          cp -r target/doc/* _site/rustdoc/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'tensor4all/tensor4all-rs'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
