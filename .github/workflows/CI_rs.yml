name: CI_rs

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  CI_BUILD_DIAGNOSTICS: target/ci-build-diagnostics

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check explicit-context-only build
        run: |
          cargo check --locked -p tensor4all-tensorbackend --no-default-features --features explicit-context,tenferro-cpu-faer
          cargo doc --locked -p tensor4all-tensorbackend --no-deps --no-default-features --features explicit-context,tenferro-cpu-faer

      - name: Run clippy
        # The public-error-doc backlog is burned down; error/panic doc
        # requirements are now repository-wide blocking (issue #566 PR3).
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc

  doctest:
    name: Doctests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2
          fallback: none

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true

      - name: Run rustdoc tests
        run: python3 scripts/ci-build-diagnostics.py rustdoc -- cargo test --locked --doc --profile ci --workspace -j 8 --timings -vv

      - name: Run mdBook tests
        env:
          TENSOR4ALL_CARGO_PROFILE: ci
          TENSOR4ALL_RUSTDOC_LOG: target/ci-build-diagnostics/rustdoc.log
        run: python3 scripts/ci-build-diagnostics.py mdbook -- ./scripts/test-mdbook.sh

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.job }}
          path: |
            target/ci-build-diagnostics
            target/cargo-timings
            target/llvm-cov-target/cargo-timings
          retention-days: 7

      - name: Report Cargo artifact size
        if: always()
        run: |
          if [[ -d target ]]; then
            du -sh target
          else
            echo "target directory was not created"
          fi

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        # No `cache-workspace-crates`: restored workspace artifacts are never
        # reuse-eligible (Cargo compares source timestamps), and kache below owns
        # compiled-artifact reuse in this job.

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          # One store per pipeline: the `ci` profile here, release plus
          # instrumentation in the coverage job.
          cache-key-prefix: t4a-ci

      - name: Run workspace tests
        # `--lib --bins --tests` leaves out example and bench targets: they add
        # 0.0 s of test execution here but ~26% of the compile CPU, and
        # `cargo clippy --workspace --all-targets` plus the scheduled heavy-tests
        # workflow keep them compiling. The diagnostics wrapper fails this job
        # when the suite itself outgrows the default pipeline (CONTRIBUTING.md,
        # CI time budget).
        run: python3 scripts/ci-build-diagnostics.py --budget-seconds 300 nextest -- cargo nextest run --locked --cargo-profile ci --workspace --lib --bins --tests --timings -v

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.job }}
          path: |
            target/ci-build-diagnostics
            target/cargo-timings
            target/llvm-cov-target/cargo-timings
          retention-days: 7

      - name: Report Cargo artifact size
        if: always()
        run: |
          if [[ -d target ]]; then
            du -sh target
          else
            echo "target directory was not created"
          fi

  scripts:
    name: Maintenance scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install HDF5 and MPI
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev libopenmpi-dev openmpi-bin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.2 --locked

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true

      - name: Check generated C API header
        run: ./scripts/check-capi-header.sh

      - name: Generate and verify public API inventory
        run: cargo run --locked -p xtask --release -- api-dump

      - name: Test the repository-rules review script
        run: python3 scripts/test-repository-rules-review.py

      - name: Test library panic audit
        run: python3 scripts/test-audit-library-panics.py

      - name: Audit library panic paths
        # Clippy passes: 10m each; Rust tool: 25m; wrapper build+audit: 35m; CI: 40m.
        # tenferro-rs #2004 made the CPU backend features mutually exclusive, so
        # no single "all features" configuration builds; the workspace also has
        # feature combinations that never built. Until the repository declares the
        # configurations worth auditing, only the default-feature pass runs
        # (see docs/worklogs/2026-10-08-tenferro-2004-consumer-migration.md).
        env:
          T4A_PANIC_AUDIT_SKIP_ALL_FEATURES: "1"
        timeout-minutes: 40
        run: python3 scripts/audit-library-panics.py

      - name: Test public-error-doc audit
        run: python3 scripts/test-check-public-error-docs.py

      - name: Audit public Result APIs (repository-wide blocking)
        # Repository-wide blocking: the pre-existing backlog is zero.
        run: python3 scripts/check-public-error-docs.py

      - name: Test crate-boundary checker
        run: python3 scripts/test-check-crate-boundaries.py

      - name: Check crate boundaries and dev cycles
        run: python3 scripts/check-crate-boundaries.py

      - name: Test coverage threshold checker
        run: python3 scripts/test-check-coverage.py

      - name: Test build diagnostics
        run: |
          python3 scripts/test-ci-build-diagnostics.py
          python3 scripts/test-test-mdbook.py

      - name: Test SRC benchmark gate runner
        run: python3 scripts/test-run-src-benchmark-gates.py

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      # book-tests depends on tensor4all-hdf5, so --exclude tensor4all-hdf5
      # still builds the HDF5 stack; the dev package is required for that.
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - uses: Swatinem/rust-cache@v2
        # See the Test job: restored workspace artifacts are not reuse-eligible,
        # and kache owns compiled-artifact reuse.

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          # Instrumented release artifacts, kept apart from the `ci`-profile store
          # the Test job uses.
          cache-key-prefix: t4a-coverage

      - name: Clear stale workspace coverage artifacts
        # Prefix cache restores can contain obsolete instrumented workspace
        # binaries. Remove those and old profiles, but retain dependency builds.
        run: cargo llvm-cov clean --workspace --locked

      - name: Generate release coverage JSON
        # Release-mode measurement: the repository's normal verification mode. The
        # same 300 s suite budget and the same target trim as the Test job apply;
        # instrumented execution of the healthy suite measures ~63 s.
        run: |
          echo "Available CPUs: $(nproc); Cargo build jobs: $CARGO_BUILD_JOBS"
          python3 scripts/ci-build-diagnostics.py --budget-seconds 300 coverage -- cargo llvm-cov nextest --locked --release --no-clean --workspace --exclude tensor4all-hdf5 --lib --bins --tests --json --output-path coverage.json --timings -v

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.job }}
          path: |
            target/ci-build-diagnostics
            target/cargo-timings
            target/llvm-cov-target/cargo-timings
          retention-days: 7

      - name: Check per-file thresholds
        run: python3 scripts/check-coverage.py coverage.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: ignore
          retention-days: 7

  rollup-rs:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - coverage
      - doctest
      - scripts
    if: always()
    permissions:
      contents: read
      # Reads this run's job timings for the total time budget below.
      actions: read
    steps:
      - name: All Rust checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: Some Rust checks failed or cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      # The single total time budget for this pipeline (CONTRIBUTING.md,
      # "CI time budget"). It gates completion, it does not cancel: the span is
      # this attempt's first job start to its last job completion, so overlapping
      # jobs are never summed and the gate's own scheduling wait is not charged to
      # the pipeline. No per-test and no per-job caps are declared anywhere else. A
      # run of 2026-10-09 measured 112 min against a healthy 12-35 min population
      # (median 20, p90 26).
      - name: Check the total pipeline time budget
        # Only a run's first attempt measures a pipeline: a re-run carries the start
        # times of the jobs it did not re-run, which would charge its own latency to
        # the pipeline. The per-job suite budgets still apply to every attempt.
        if: ${{ always() && github.run_attempt == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_SECONDS: "2400"
        run: |
          set -euo pipefail
          if ! jobs=$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100"); then
            echo "::error::the CI time budget could not be verified (the job listing failed); re-run once the API or its permissions are back"
            exit 1
          fi
          # `gh api` has no jq --arg flags, so the budget is passed to jq here. This
          # job is excluded so its own queue time is not charged to the pipeline.
          if ! summary=$(jq --argjson budget "$BUDGET_SECONDS" '
                [.[] | .jobs[]
                 | select(.started_at != null and .completed_at != null
                          and .conclusion != "skipped" and .name != "rollup-rs")]
                | map(. + {elapsed: ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))})
                | if length == 0 then error("no completed jobs") else . end
                | {span_seconds: ((map(.completed_at | fromdateiso8601) | max) - (map(.started_at | fromdateiso8601) | min)),
                   budget_seconds: $budget,
                   jobs: (sort_by(-.elapsed) | map({name, seconds: .elapsed}))}
                | . + {over_budget: (.span_seconds > .budget_seconds)}' <<<"$jobs"); then
            echo "::error::the CI time budget could not be verified (the job listing could not be parsed); re-run once the API or its permissions are back"
            exit 1
          fi
          jq -r '"pipeline span: \(.span_seconds)s / budget \(.budget_seconds)s", (.jobs[] | "  \(.seconds)s  \(.name)")' <<<"$summary"
          if [ "$(jq -r '.over_budget' <<<"$summary")" = "true" ]; then
            echo "::error::the pipeline took $(jq -r '.span_seconds' <<<"$summary")s, above its $((BUDGET_SECONDS / 60))-minute total budget. Move the slow test into the scheduled heavy-tests workflow (CONTRIBUTING.md); do not raise this budget."
            exit 1
          fi
