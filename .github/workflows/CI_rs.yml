name: CI_rs

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  CI_BUILD_DIAGNOSTICS: target/ci-build-diagnostics

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check explicit-context-only build
        run: |
          cargo check --locked -p tensor4all-tensorbackend --no-default-features --features explicit-context
          cargo doc --locked -p tensor4all-tensorbackend --no-deps --no-default-features --features explicit-context
          cargo test --locked -p tensor4all-tensorbackend --no-default-features --features explicit-context --test explicit_context_surface

      - name: Check explicit-only library crates (#1403)
        # Library builds are explicit by default; only test/bench builds and the
        # C API, Python and docs crates opt into `global-defaults`. Fail if a
        # library dependency edge turns it back on for this set: every workspace
        # library that depends on tensor4all-core except the context-free
        # facades that opt in on purpose (tensor4all-capi, tensor4all-hdf5);
        # the tools under xtask/ and tools/ do not depend on core.
        run: |
          LIBS="-p tensor4all-tensorbackend -p tensor4all-core -p tensor4all-simplett -p tensor4all-aci -p tensor4all-treetn -p tensor4all-treeaci -p tensor4all-treersi -p tensor4all-treetci -p tensor4all-tensorci -p tensor4all-interpolativeqtt -p tensor4all-quanticstci -p tensor4all-quanticstransform -p tensor4all-itensorlike -p tensor4all-partitionedtreetn"
          # Capture first, so a failing `cargo tree` fails the step instead of
          # reading as "no match".
          TREE=$(cargo tree --locked $LIBS -e normal,features -i tensor4all-tensorbackend)
          if grep -F 'feature "global-defaults"' <<<"$TREE"; then
            echo "a library crate enables global-defaults by default" >&2
            exit 1
          fi
          cargo clippy --locked --lib $LIBS -- -D warnings

      - name: Test the explicit-only configuration (#1403)
        # An isolated workspace: inside the repository workspace the
        # dev-dependencies enable `global-defaults`, so no workspace test target
        # builds the configuration users get from the default features.
        working-directory: tests/feature-configurations/explicit-only
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/explicit-only
        run: cargo test --locked --test explicit_only

      - name: Run clippy
        # The public-error-doc backlog is burned down; error/panic doc
        # requirements are now repository-wide blocking (issue #566 PR3).
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc

      - name: Check opt-in benchmark targets
        run: cargo clippy --locked -p tensor4all-benchmarks -p tensor4all-treetn --all-targets --features tensor4all-benchmarks/fourier,tensor4all-benchmarks/patched-fourier,tensor4all-benchmarks/legacy-comparisons,tensor4all-benchmarks/itensorlike -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc

  doctest:
    name: Doctests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2
          fallback: none

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Pull requests run the doctests. A push to main only warms the cache this
      # job restores: the merged head already passed them as a pull request, and
      # `cargo test --doc` cannot compile without running them (`--no-run` is
      # refused for doctests), so the lib build that populates `target/` is
      # done directly.
      - name: Warm the Doctests cache (push to main)
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo build --locked --profile ci --workspace --lib -j 8

      - name: Run rustdoc tests
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/ci-build-diagnostics.py rustdoc -- cargo test --locked --doc --profile ci --workspace -j 8 --timings -vv

      - name: Run mdBook tests
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TENSOR4ALL_CARGO_PROFILE: ci
          TENSOR4ALL_RUSTDOC_LOG: target/ci-build-diagnostics/rustdoc.log
        run: python3 scripts/ci-build-diagnostics.py mdbook -- ./scripts/test-mdbook.sh

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.job }}
          path: |
            target/ci-build-diagnostics
            target/cargo-timings
            target/llvm-cov-target/cargo-timings
          retention-days: 7

      - name: Report Cargo artifact size
        if: always()
        run: |
          if [[ -d target ]]; then
            du -sh target
          else
            echo "target directory was not created"
          fi

  test:
    name: Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Deletes main's superseded kache snapshots (see below).
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
        # No `cache-workspace-crates`: restored workspace artifacts are never
        # reuse-eligible (Cargo compares source timestamps), and kache below owns
        # compiled-artifact reuse in this job.

      # The kache store is persisted here rather than through the action's own GitHub cache
      # backend: that backend keys the whole store by the lockfile hash alone, and GitHub
      # cache entries are immutable, so the entry freezes at the first run after a lockfile
      # change and later commits cannot publish what they compiled. Measured: 1.8% of 168
      # units hit for a new commit (build 612 s) against 100% for an exact re-run of the same
      # commit (build 12 s). A per-commit key plus a prefix restore key keeps the newest
      # snapshot reachable and lets each run publish its own.

      - name: Restore the kache store
        id: kache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kache
          key: kache-t4a-ci-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          # A pull request restores main's newest snapshot. The second prefix
          # survives a lockfile change: kache entries are content-addressed, so
          # a snapshot from another lockfile only misses units that changed.
          restore-keys: |
            kache-t4a-ci-${{ hashFiles('**/Cargo.lock') }}-
            kache-t4a-ci-

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          # The workflow owns store persistence (above); the action installs kache,
          # configures RUSTC_WRAPPER and writes the job summary.
          github-cache: "false"
          cache-dir: ${{ runner.temp }}/kache

      - name: Run workspace tests
        # `--lib --bins --tests` leaves out example and bench targets: they add
        # 0.0 s of test execution here but ~26% of the compile CPU, and
        # `cargo clippy --workspace --all-targets` plus the scheduled heavy-tests
        # workflow keep them compiling. The diagnostics wrapper fails this job
        # when the suite itself outgrows the default pipeline (CONTRIBUTING.md,
        # CI time budget).
        run: python3 scripts/ci-build-diagnostics.py --budget-seconds 300 nextest -- cargo nextest run --locked --cargo-profile ci --workspace --lib --bins --tests --timings -v

      - name: Save the kache store
        # Main only (#1486). A pull request's snapshot was ~1.7 GB that nothing
        # but its own next push restored, and it evicted main's snapshots from the
        # 10 GB repository cache. Compiled artifacts are valid whatever the tests
        # did, so save on failure too.
        id: kache-save
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.kache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kache
          key: kache-t4a-ci-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}

      - name: Prune main's older kache snapshots
        # Only the newest snapshot is ever restored. Older ones (~1.7 GB each)
        # would push other caches out of the 10 GB repository cache.
        if: ${{ always() && steps.kache-save.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: kache-t4a-ci-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key kache-t4a-ci- \
              --limit 100 --json id,key --jq ".[] | select(.key != \"$KEEP\") | .id" |
            while read -r id; do
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
            done

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.job }}
          path: |
            target/ci-build-diagnostics
            target/cargo-timings
            target/llvm-cov-target/cargo-timings
          retention-days: 7

      - name: Report Cargo artifact size
        if: always()
        run: |
          if [[ -d target ]]; then
            du -sh target
          else
            echo "target directory was not created"
          fi

  scripts:
    name: Maintenance scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install HDF5 and MPI
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev libopenmpi-dev openmpi-bin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.2 --locked

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check generated C API header
        run: ./scripts/check-capi-header.sh

      - name: Generate and verify public API inventory
        run: cargo run --locked -p xtask --release -- api-dump

      - name: Check one version per dependency identity
        run: ./scripts/check-single-versions.sh

      - name: Check the Fourier-only dependency graph
        run: ./scripts/check-fourier-dependencies.sh

      - name: Test M6 dependency graph assertions
        run: python3 scripts/test-check-m6-dependencies.py

      - name: Check isolated TreeTN and M6 dependency graphs
        run: python3 scripts/check-m6-dependencies.py

      - name: Test the repository-rules review script
        run: python3 scripts/test-repository-rules-review.py

      - name: Test the implicit-engine-site ratchet
        run: python3 scripts/test-check-implicit-engine-sites.py

      - name: Check no new implicit-engine sites (#1376 ratchet)
        # Whole-tree source scan against scripts/implicit-engine-sites-baseline.json;
        # a few seconds. See REPOSITORY_RULES.md "Explicit Execution Engine Ratchet".
        run: python3 scripts/check-implicit-engine-sites.py

      - name: Test the review waiver verifier
        run: node --test scripts/test-review-waiver.js

      - name: Test library panic audit
        run: python3 scripts/test-audit-library-panics.py

      - name: Audit library panic paths
        # One default-feature Clippy pass: 10m; Rust tool: 25m; wrapper
        # build+audit: 35m; CI: 40m. This step keeps its historical default-pass
        # baseline. tenferro-rs #2004 made the CPU backend features mutually
        # exclusive, so there is no buildable `--all-features` pass; the
        # supported non-default configurations (system BLAS, provider injection,
        # MPI, diagnostics, HDF5 runtime loading) are checked and audited, and
        # CUDA compile-checked, nightly by .github/workflows/feature-matrix.yml (CONTRIBUTING.md,
        # "Supported feature configurations").
        timeout-minutes: 40
        run: python3 scripts/audit-library-panics.py

      - name: Test public-error-doc audit
        run: python3 scripts/test-check-public-error-docs.py

      - name: Audit public Result APIs (repository-wide blocking)
        # Repository-wide blocking: the pre-existing backlog is zero.
        run: python3 scripts/check-public-error-docs.py

      - name: Test crate-boundary checker
        run: python3 scripts/test-check-crate-boundaries.py

      - name: Check crate boundaries and dev cycles
        run: python3 scripts/check-crate-boundaries.py

      - name: Test test-target checker
        run: python3 scripts/test-check-test-targets.py

      - name: Check every integration test file is compiled
        run: python3 scripts/check-test-targets.py

      - name: Test coverage threshold checker
        run: python3 scripts/test-check-coverage.py

      - name: Test build diagnostics
        run: |
          python3 scripts/test-ci-build-diagnostics.py
          python3 scripts/test-test-mdbook.py

      - name: Test SRC benchmark gate runner
        run: python3 scripts/test-run-src-benchmark-gates.py

  rollup-rs:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - doctest
      - scripts
    if: always()
    permissions:
      contents: read
      # Reads this run's job timings for the total time budget below.
      actions: read
    steps:
      - name: All Rust checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: Some Rust checks failed or cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      # The single total time budget for this pipeline (CONTRIBUTING.md,
      # "CI time budget"). It gates completion, it does not cancel: the span is
      # this attempt's first job start to its last job completion, so overlapping
      # jobs are never summed and the gate's own scheduling wait is not charged to
      # the pipeline. No per-test and no per-job caps are declared anywhere else. A
      # run of 2026-10-09 measured 112 min against a healthy 12-35 min population
      # (median 20, p90 26).
      - name: Check the total pipeline time budget
        # Only a run's first attempt measures a pipeline: a re-run carries the start
        # times of the jobs it did not re-run, which would charge its own latency to
        # the pipeline. The per-job suite budgets still apply to every attempt.
        if: ${{ always() && github.run_attempt == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_SECONDS: "2400"
        run: |
          set -euo pipefail
          if ! jobs=$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100"); then
            echo "::error::the CI time budget could not be verified (the job listing failed); re-run once the API or its permissions are back"
            exit 1
          fi
          # `gh api` has no jq --arg flags, so the budget is passed to jq here. This
          # job is excluded so its own queue time is not charged to the pipeline.
          if ! summary=$(jq --argjson budget "$BUDGET_SECONDS" '
                [.[] | .jobs[]
                 | select(.started_at != null and .completed_at != null
                          and .conclusion != "skipped" and .name != "rollup-rs")]
                | map(. + {elapsed: ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))})
                | if length == 0 then error("no completed jobs") else . end
                | {span_seconds: ((map(.completed_at | fromdateiso8601) | max) - (map(.started_at | fromdateiso8601) | min)),
                   budget_seconds: $budget,
                   jobs: (sort_by(-.elapsed) | map({name, seconds: .elapsed}))}
                | . + {over_budget: (.span_seconds > .budget_seconds)}' <<<"$jobs"); then
            echo "::error::the CI time budget could not be verified (the job listing could not be parsed); re-run once the API or its permissions are back"
            exit 1
          fi
          jq -r '"pipeline span: \(.span_seconds)s / budget \(.budget_seconds)s", (.jobs[] | "  \(.seconds)s  \(.name)")' <<<"$summary"
          if [ "$(jq -r '.over_budget' <<<"$summary")" = "true" ]; then
            echo "::error::the pipeline took $(jq -r '.span_seconds' <<<"$summary")s, above its $((BUDGET_SECONDS / 60))-minute total budget. Move the slow test into the scheduled heavy-tests workflow (CONTRIBUTING.md); do not raise this budget."
            exit 1
          fi
