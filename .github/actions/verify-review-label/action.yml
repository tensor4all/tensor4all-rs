name: Verify review waiver
description: >-
  Fail unless a maintain/admin collaborator commented `waive-review <sha>` naming
  the pull request's current head. Prevents a stale, abbreviated or
  non-maintainer waiver from skipping the repository-rules review.

inputs:
  label:
    description: Label name that requests the waiver (a pointer for humans)
    required: true

runs:
  using: composite
  steps:
    # The decision lives in scripts/review-waiver.js so this action and any
    # future caller cannot drift apart, and so it can be tested offline against
    # recorded comment sets (`node --test scripts/test-review-waiver.js`).
    #
    # The label no longer grants anything on its own: it only makes a human's
    # request visible. The exemption is bound to a commit, which is why a push
    # revokes it and a close/reopen that keeps the same head does not.
    - uses: actions/github-script@v7
      env:
        REVIEW_LABEL: ${{ inputs.label }}
      with:
        script: |
          const { run } = require(
            `${process.env.GITHUB_WORKSPACE}/scripts/review-waiver.js`
          );
          await run({
            github,
            core,
            context,
            labelName: process.env.REVIEW_LABEL,
          });
